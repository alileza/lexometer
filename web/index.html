<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lexometer</title>
<style>
  :root {
    --accent-blue: #0057ff; --accent-red: #ff4034; --accent-green: #00db7f;
    --ink: #0a0d12; --ink-2: #6b7280; --ink-3: #9ca4ad;
    --surface: #ffffff; --surface-2: rgba(0,42,97,0.04); --inverted: #0e1116;
    --border: rgba(0,42,97,0.10);
    --radius: 16px;
    --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); color: var(--ink); background: var(--surface); line-height: 1.5; font-size: 15px; }
  header { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,0.85);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
    padding: 13px 28px; display: flex; align-items: center; gap: 12px; }
  .mark { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg,#14181f,#2b323e);
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 14px; }
  .name { font-weight: 720; font-size: 16px; }
  #status { margin-left: auto; font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
  #status.live .dot { background: var(--accent-green); box-shadow: 0 0 0 3px rgba(0,219,127,0.2); }
  main { max-width: 1060px; margin: 0 auto; padding: 26px 28px 60px; }
  .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
  @media (max-width: 820px) { .stats { grid-template-columns: repeat(2,1fr); } }
  .stat { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .stat .value { font-size: 27px; font-weight: 740; letter-spacing: -0.02em; line-height: 1.15; }
  .stat .label { margin-top: 4px; font-size: 12.5px; color: var(--ink-2); }
  .card { border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px 12px; margin-top: 16px; }
  .card h3 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .card .sub { font-size: 12.5px; color: var(--ink-2); margin-bottom: 10px; }
  .card .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); margin: 4px 0 8px; flex-wrap: wrap; }
  .card .legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .card .legend .swatch { width: 11px; height: 11px; border-radius: 3px; }
  .chart-scroll { overflow-x: auto; }
  svg { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); }
  th { font-weight: 580; color: var(--ink-2); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: none; }
  td.num { font-variant-numeric: tabular-nums; text-align: right; }
  th.num { text-align: right; }
  #empty { border: 1px dashed var(--border); border-radius: var(--radius); padding: 34px; margin-top: 16px;
    color: var(--ink-2); font-size: 14px; }
  #empty pre { font-family: var(--mono); font-size: 12.5px; background: var(--inverted); color: #e6edf3;
    padding: 14px 16px; border-radius: 10px; margin-top: 12px; overflow-x: auto; line-height: 1.7; }
  #tip { position: fixed; pointer-events: none; z-index: 50; background: var(--inverted); color: #e6edf3;
    font-size: 12px; padding: 7px 10px; border-radius: 8px; opacity: 0; transition: opacity .1s; max-width: 240px; }
  #tip .t { font-weight: 650; color: #fff; }
  #tip .v { color: #9ca4ad; }
</style>
</head>
<body>
<header>
  <span class="mark">L</span><span class="name">lexometer</span>
  <span id="status"><span class="dot"></span><span id="status-text">waiting for telemetry…</span></span>
</header>
<main id="app"></main>
<div id="tip"></div>
<script src="/dist/app.js"></script>
</body>
</html>
