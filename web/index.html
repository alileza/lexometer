<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tokometer</title>
<link rel="stylesheet" href="/dist/app.css">
<style>
  /* Grafana-dark theme */
  :root {
    --page: #111217;
    --panel: #181b1f;
    --panel-border: #23262b;
    --text: #ccccdc;
    --text-dim: rgba(204,204,220,0.65);
    --text-faint: rgba(204,204,220,0.4);
    --grid: rgba(204,204,220,0.07);
    --blue: #5794F2; --green: #73BF69; --yellow: #FADE2A;
    --orange: #FF9830; --red: #F2495C; --purple: #B877D9;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--page); color: var(--text); font-size: 14px; line-height: 1.5; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--panel); border-bottom: 1px solid var(--panel-border);
    padding: 10px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .mark { width: 24px; height: 24px; border-radius: 4px; background: linear-gradient(135deg, #F2CC0C, #FF9830);
    display: grid; place-items: center; color: #111; font-weight: 800; font-size: 13px; }
  .name { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  #status { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; margin-left: auto; flex: none; white-space: nowrap; }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); }
  #status.live .dot { background: var(--green); box-shadow: 0 0 0 3px rgba(115,191,105,0.2); }

  /* tab bar */
  nav.tabs {
    max-width: 1200px; margin: 0 auto; padding: 10px 20px 0;
    display: flex; gap: 4px; border-bottom: 1px solid var(--panel-border);
  }
  nav.tabs button {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--text-dim); font-family: var(--font); font-size: 13px; font-weight: 500;
    padding: 8px 14px 9px; cursor: pointer; margin-bottom: -1px;
  }
  nav.tabs button:hover { color: var(--text); }
  nav.tabs button.active { color: var(--text); border-bottom-color: var(--orange); }
  nav.tabs button .badge {
    display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 8px;
    background: rgba(255,152,48,0.18); color: var(--orange); font-size: 10.5px; font-family: var(--mono);
  }
  .pane[hidden] { display: none; }

  main { max-width: 1200px; margin: 0 auto; padding: 16px 20px 48px; }
  #live { margin-bottom: 8px; }
  #live .rate { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--green); }

  .row { display: grid; gap: 8px; margin-bottom: 8px; }
  .row.stats { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .row.half { grid-template-columns: 1fr 1fr; }
  @media (max-width: 820px) { .row.half { grid-template-columns: 1fr; } }

  .donut-wrap { display: flex; align-items: center; gap: 18px; padding: 6px 4px; }
  .donut-legend { flex: 1 1 0; min-width: 0; }
  .donut-legend .dl-row { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 1.9; }
  .donut-legend .dl-row .sw { width: 12px; height: 4px; border-radius: 1px; flex: none; }
  .donut-legend .dl-row .nm { color: var(--text-dim); flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .donut-legend .dl-row .vl { font-family: var(--mono); font-size: 11.5px; }
  .donut-legend .dl-row .pc { font-family: var(--mono); font-size: 11px; color: var(--text-faint); width: 44px; text-align: right; }
  .donut-center { font-family: var(--font); }

  .panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 2px; }
  .panel .panel-title {
    padding: 8px 12px 0; font-size: 12px; font-weight: 500; color: var(--text);
    display: flex; align-items: baseline; gap: 8px;
  }
  .panel .panel-title .desc { color: var(--text-faint); font-weight: 400; font-size: 11px; }
  .panel .panel-body { padding: 8px 12px 10px; }

  .stat-panel { padding: 12px 14px; }
  .stat-panel .label { font-size: 11px; color: var(--text-dim); margin-bottom: 2px; }
  .stat-panel .value { font-size: 26px; font-weight: 500; letter-spacing: -0.01em; }
  .stat-panel .value.green { color: var(--green); }
  .stat-panel .value.blue { color: var(--blue); }
  .stat-panel .value.red { color: var(--red); }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--panel-border); }
  th { color: var(--text-dim); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: none; }
  td.num { font-variant-numeric: tabular-nums; text-align: right; font-family: var(--mono); font-size: 12px; }
  th.num { text-align: right; }

  .dist { display: flex; height: 6px; border-radius: 2px; overflow: hidden; min-width: 110px; max-width: 180px; background: rgba(204,204,220,0.06); }
  .dist div { min-width: 1px; }

  #empty { border: 1px dashed var(--panel-border); border-radius: 2px; padding: 28px; color: var(--text-dim); font-size: 13.5px; }
  #empty pre { font-family: var(--mono); font-size: 12px; background: #0b0c0e; color: #ccccdc; padding: 12px 14px;
    border-radius: 4px; margin-top: 10px; overflow-x: auto; line-height: 1.7; border: 1px solid var(--panel-border); }
  #empty code { font-family: var(--mono); color: var(--yellow); }

  /* uPlot chrome, Grafana-flavored */
  .u-legend { font-family: var(--font) !important; font-size: 11px !important; color: var(--text-dim) !important; text-align: left !important; padding: 2px 0 0 !important; }
  .u-legend .u-marker { border-radius: 1px; width: 12px !important; height: 4px !important; margin-top: 5px; }
  .u-legend th { border-bottom: none; padding: 0 4px; font-weight: 400; text-transform: none; letter-spacing: 0; cursor: pointer; }
  .u-legend td { border-bottom: none; padding: 0 8px 0 0; font-family: var(--mono); font-size: 11px; }
  .u-legend tr.u-off th, .u-legend tr.u-off td { opacity: 0.35; }
  .u-select { background: rgba(87,148,242,0.15); border: 1px solid rgba(87,148,242,0.4); }

  #tip {
    position: fixed; pointer-events: none; z-index: 50; display: none;
    background: #1f2228; border: 1px solid #2c3038; color: var(--text);
    font-size: 12px; padding: 8px 10px; border-radius: 2px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5); min-width: 160px; max-width: 280px;
  }
  #tip .tt { color: var(--text-dim); font-size: 11px; margin-bottom: 5px; }
  #tip .tr { display: flex; align-items: center; gap: 7px; line-height: 1.7; }
  #tip .tr .sw { width: 12px; height: 4px; border-radius: 1px; flex: none; }
  #tip .tr .nm { color: var(--text-dim); flex: 1 1 0; }
  #tip .tr .vl { font-family: var(--mono); font-size: 11.5px; }
</style>
</head>
<body>
<header>
  <span class="mark">T</span><span class="name">tokometer</span>
  <span id="status"><span class="dot"></span><span id="status-text">reading Claude Code sessions…</span></span>
</header>
<nav class="tabs" id="tabs">
  <button data-pane="overview" class="active">Overview</button>
  <button data-pane="prompts">Prompts</button>
  <button data-pane="context">Context</button>
</nav>
<main>
  <section class="pane" data-pane="overview">
    <div id="live"></div><div id="app"></div>
  </section>
  <section class="pane" data-pane="prompts" hidden>
    <div id="setup-root"></div><div id="events-root"></div>
  </section>
  <section class="pane" data-pane="context" hidden>
    <div id="attr"></div>
  </section>
</main>
<div id="tip"></div>
<script src="/dist/app.js"></script>
</body>
</html>
